# Настройки сервера Nitro Rush.
# После правки: sudo systemctl restart nitrorush-server

# Название в списке игр (локальная сеть) и в лобби
NAME="Nitro Rush сервер"
# UDP-порт игры (его пробрасывают на роутере)
PORT=24680
# Максимум игроков (2–16)
MAX_PLAYERS=8
# Ботов по умолчанию в новом лобби (0–6), лидер может поменять
BOTS=3
